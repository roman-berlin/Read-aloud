<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#121419">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7f4ed">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Read Aloud">
  <meta name="description" content="Reads a PDF or text book aloud, entirely in your browser.">
  <title>Read Aloud</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h7a3 3 0 0 1 3 3v13a2 2 0 0 0-2-2H4zM20 4h-7a3 3 0 0 0-3 3v13a2 2 0 0 1 2-2h8z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
      <span class="brand-text">Read Aloud</span>
    </div>
    <div class="top-actions">
      <!-- Interface language — separate from the reading-voice language inside the book settings. -->
      <select id="ui-lang" class="ui-lang" aria-label="Interface language">
        <option value="en">English</option>
        <option value="he">עברית</option>
        <option value="ru">Русский</option>
      </select>
      <label class="upload" for="file">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4m0 0-4 4m4-4 4 4M4 20h16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span id="upload-label">Upload PDF or .txt</span>
        <input id="file" type="file" accept=".pdf,.txt,application/pdf,text/plain" aria-label="Upload PDF or .txt">
      </label>
    </div>
  </header>

  <main>
    <div id="chips" class="chips" aria-label="Voices installed on this device"></div>

    <p id="error" class="error" role="alert" hidden></p>

    <label id="empty" class="empty" for="file">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h7a3 3 0 0 1 3 3v13a2 2 0 0 0-2-2H4zM20 4h-7a3 3 0 0 0-3 3v13a2 2 0 0 1 2-2h8z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
      <span class="empty-title" id="empty-title">Tap here to choose a book</span>
      <span id="empty-desc">One PDF or plain-text (.txt) file at a time — or drop it anywhere on this page. Everything happens in your browser; nothing is uploaded anywhere.</span>
    </label>

    <section id="book" hidden>
      <h1 id="title" dir="auto"></h1>
      <p id="stats" class="stats"></p>

      <div class="settings">
        <label><span id="label-lang">Reading language</span> <select id="lang"></select></label>
        <label><span id="label-voice">Voice</span> <select id="voice" dir="ltr"></select></label>
        <label><span id="label-rate">Speed</span>
          <select id="rate" dir="ltr">
            <option value="0.75">0.75×</option>
            <option value="1" selected>1×</option>
            <option value="1.25">1.25×</option>
            <option value="1.5">1.5×</option>
            <option value="2">2×</option>
          </select>
        </label>
      </div>

      <p id="notice" class="notice" role="status" hidden></p>
      <p id="persist" class="hint" hidden>This book is too large to remember after a reload — it stays loaded until you leave the page.</p>

      <div id="text" class="text"></div>
    </section>
    <!-- Before the credit in the source so Tab goes from the book settings to the player, not to the
         WhatsApp link at the end of the book; it is position:fixed, so this does not move it on screen. -->
    <footer id="player" class="player" dir="ltr">
      <div id="progress" class="progress" role="slider" tabindex="0" aria-label="Position in book" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div id="fill" class="fill"></div>
      </div>
      <div class="row">
        <span id="position" class="position">—</span>
        <div class="buttons">
          <button id="stop" class="btn stop" type="button" aria-label="Stop" disabled>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6h12v12H6z"/></svg>
          </button>
          <button id="play" class="btn play" type="button" aria-label="Play" disabled>
            <svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
            <svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
          </button>
          <!-- The speed settings scroll away while the book is read, so the bar carries it too. Tapping
               steps through the same values as the Speed list and keeps the two in sync. -->
          <button id="speed" class="btn speed" type="button" aria-label="Speed 1×" disabled>1×</button>
        </div>
        <span id="status" class="status" role="status" aria-live="polite">Ready</span>
      </div>
    </footer>
    <!-- Below the start panel, or below the book text once a book is open: always after the content. -->
    <footer id="credit" class="credit">
      <p><span id="credit-made">Made by</span> <strong>Automatixy</strong> · <span id="credit-tag">we build automations and useful apps</span></p>
      <!-- href is filled by app.js from WHATSAPP_NUMBER, with a prefilled message in the interface language. -->
      <a id="wa" class="wa" href="#" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg><span id="wa-label">Message us on WhatsApp</span></a>
    </footer>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
